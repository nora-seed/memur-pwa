name: Veriyi doğrula

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund
      - name: Sözdizimi kontrolü
        run: npm run check
      - name: data.json doğrula
        run: npm run validate
      - name: Testler
        run: npm test
